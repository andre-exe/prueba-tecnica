spring:
  application:
    name: coworking-reservations
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

server:
  port: 8080
  shutdown: graceful

# valores comunes
app:
  reservation:
    min-duration: 30m
    max-duration: 8h
    max-advance-days: 90
    completion-job-cron: "0 */5 * * * *"
  payment:
    base-url: http://localhost:8089
    connect-timeout: 1s
    read-timeout: 3s
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    thread-name-prefix: notification-
  notification:
    simulated-delay: 2s
    from: no-reply@coworking.local
  report:
    ttl: 10m
    max-size: 100
    max-range-days: 366
  jwt:
    issuer: coworking-reservations
    expiration: 1h
