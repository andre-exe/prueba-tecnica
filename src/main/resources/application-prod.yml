spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  payment:
    base-url: ${PAYMENT_BASE_URL}
  bootstrap-admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    full-name: ${ADMIN_FULL_NAME:Administrador}

logging:
  level:
    root: INFO
    com.coworking.reservations: INFO
